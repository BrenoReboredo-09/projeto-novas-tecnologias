<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa de Projetos de Lei</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #eef5ef;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* CABEÇALHO */

        header {
            background: #2e8b3c;
            color: white;
            text-align: center;
            padding: 30px;
            border-bottom: 3px solid #1f6b2b;
            position: relative;
        }

        header h1 {
            font-size: 3rem;
        }

        .btn-login {
            position: absolute;
            left: 25px;
            top: 50%;
            transform: translateY(-50%);

            color: white;
            text-decoration: none;
            font-weight: bold;

            border: 2px solid white;
            border-radius: 8px;

            padding: 10px 20px;

            transition: 0.3s;
        }

        .btn-login:hover {
            background: white;
            color: #2e8b3c;
        }

        /* CONTEÚDO */

        .container {
            width: 80%;
            max-width: 1200px;
            margin: 60px auto;
        }

        /* CAIXA DE PESQUISA */

        .caixa-pesquisa {
            background: white;
            border: 2px solid #3ca34a;
            border-radius: 15px;
            padding: 40px;
            margin-bottom: 40px;
        }

        .caixa-pesquisa h2 {
            color: #19692c;
            font-size: 2.5rem;
            margin-bottom: 35px;
        }

        .formulario {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        input,
        select {
            padding: 15px;
            font-size: 18px;
            border: 2px solid #3ca34a;
            border-radius: 8px;
        }

        input {
            flex: 2;
            min-width: 300px;
        }

        select {
            flex: 1;
            min-width: 180px;
        }

        button {
            background: #3ca34a;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px 35px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #2f853b;
        }

        /* RESULTADOS */

        .caixa-resultados {
            background: white;
            border: 2px solid #3ca34a;
            border-radius: 15px;
            padding: 40px;
            min-height: 220px;
        }

        .caixa-resultados h2 {
            color: #19692c;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .caixa-resultados p {
            font-size: 1.3rem;
        }

        /* RODAPÉ */

        footer {
            margin-top: auto;
            background: #d9ecd9;
            border-top: 4px solid #19692c;
            text-align: center;
            padding: 25px;
            color: #19692c;
            font-weight: bold;
        }

        /* RESPONSIVO */

        @media (max-width: 768px) {

            header h1 {
                font-size: 2rem;
            }

            .btn-login {
                position: static;
                transform: none;
                display: inline-block;
                margin-bottom: 20px;
            }

            .formulario {
                flex-direction: column;
            }

            input,
            select,
            button {
                width: 100%;
            }
        }

                header h1 {
            font-size: 3rem;
        }

        .btn-perfil {
            position: absolute;
            right: 25px;
            top: 50%;
            transform: translateY(-50%);

            color: white;
            text-decoration: none;
            font-weight: bold;

            border: 2px solid white;
            border-radius: 8px;

            padding: 10px 20px;

            transition: 0.3s;
        }

        .btn-perfil:hover {
            background: white;
            color: #2e8b3c;
        }
    </style>
</head>

<body>

    <header>

        <a href="login.html" class="btn-login">
            Login
        </a>

        <h1>Pesquisa de Projetos de Lei</h1>

        <a href="perfil.html" class="btn-perfil">
        Meu Perfil
        </a>

    </header>

    <div class="container">

        <div class="caixa-pesquisa">

            <h2>Pesquisa de Projetos de Lei</h2>

            <form class="formulario">

                <input
                    type="text"
                    name="busca"
                    placeholder="Número do projeto, título ou autor">

                <select name="status">
                    <option value="">Todos os status</option>
                    <option value="tramitacao">Em tramitação</option>
                    <option value="aprovado">Aprovado</option>
                    <option value="arquivado">Arquivado</option>
                </select>

                <select name="uf">
                    <option value="">Todas as UFs</option>
                    <option value="AC">AC</option>
                    <option value="AL">AL</option>
                    <option value="AP">AP</option>
                    <option value="AM">AM</option>
                    <option value="BA">BA</option>
                    <option value="CE">CE</option>
                    <option value="DF">DF</option>
                    <option value="ES">ES</option>
                    <option value="GO">GO</option>
                    <option value="MA">MA</option>
                    <option value="MT">MT</option>
                    <option value="MS">MS</option>
                    <option value="MG">MG</option>
                    <option value="PA">PA</option>
                    <option value="PB">PB</option>
                    <option value="PR">PR</option>
                    <option value="PE">PE</option>
                    <option value="PI">PI</option>
                    <option value="RJ">RJ</option>
                    <option value="RN">RN</option>
                    <option value="RS">RS</option>
                    <option value="RO">RO</option>
                    <option value="RR">RR</option>
                    <option value="SC">SC</option>
                    <option value="SP">SP</option>
                    <option value="SE">SE</option>
                    <option value="TO">TO</option>
                </select>

                <button type="submit">
                    Pesquisar
                </button>

            </form>

        </div>

        <div class="caixa-resultados">

            <h2>Resultados da Pesquisa</h2>

            <p>
                Faça uma pesquisa para ver os resultados aqui.
            </p>

        </div>

    </div>

    <footer>
        © 2026 - Todos os direitos reservados.
    </footer>

</body>
</html>
