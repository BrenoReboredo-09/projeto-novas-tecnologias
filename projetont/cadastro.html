<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Sistema</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #eef5ef;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* CABEÇALHO */

        header {
            background: #2e8b3c;
            color: white;
            text-align: center;
            padding: 30px;
            border-bottom: 3px solid #1f6b2b;
        }

        header h1 {
            font-size: 2.5rem;
        }

        /* CONTAINER PRINCIPAL */

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .card {
            width: 100%;
            max-width: 1000px;
            background: white;
            border: 2px solid #3ca34a;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        /* LADO ESQUERDO */

        .painel-esquerdo {
            width: 35%;
            background: #3ca34a;
            color: white;
            padding: 50px 30px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .painel-esquerdo h2 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .painel-esquerdo p {
            margin-bottom: 30px;
        }

        .painel-esquerdo button {
            background: transparent;
            color: white;
            border: 2px solid white;
            padding: 14px 40px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .painel-esquerdo button:hover {
            background: white;
            color: #3ca34a;
        }

        /* LADO DIREITO */

        .painel-direito {
            width: 65%;
            padding: 50px;
        }

        .painel-direito h2 {
            text-align: center;
            color: #2e8b3c;
            margin-bottom: 35px;
            font-size: 2rem;
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo input {
            width: 100%;
            padding: 16px;
            border: 2px solid #3ca34a;
            border-radius: 8px;
            font-size: 16px;
        }

        .campo input:focus {
            outline: none;
            border-color: #1f6b2b;
        }

        .btn-cadastrar {
            width: 100%;
            padding: 16px;
            background: #3ca34a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-cadastrar:hover {
            background: #2f853b;
        }

        /* RODAPÉ */

        footer {
            background: #d9ecd9;
            border-top: 4px solid #19692c;
            text-align: center;
            padding: 20px;
            color: #19692c;
            font-weight: bold;
        }

        /* RESPONSIVO */

        @media (max-width: 768px) {

            .card {
                flex-direction: column;
            }

            .painel-esquerdo,
            .painel-direito {
                width: 100%;
            }

            .painel-esquerdo {
                padding: 40px 20px;
            }

            .painel-direito {
                padding: 30px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Sistema de Projetos de Lei</h1>
</header>

<div class="container">

    <div class="card">

        <div class="painel-esquerdo">
            <h2>Bem-vindo de volta</h2>
            <p>Acesse sua conta para acompanhar projetos e pesquisas.</p>

            <button type="button">
                <a href="login.html">Entrar</a>
            </button>
        </div>

        <div class="painel-direito">

            <h2>Crie sua Conta</h2>

            <form method="post">

                <div class="campo">
                    <input
                        type="text"
                        name="nome"
                        placeholder="Nome completo">
                </div>

                <div class="campo">
                    <input
                        type="email"
                        name="email"
                        placeholder="E-mail">
                </div>

                <div class="campo">
                    <input
                        type="password"
                        name="senha"
                        placeholder="Senha">
                </div>

                <button class="btn-cadastrar" type="submit">
                    Cadastrar
                </button>

            </form>

        </div>

    </div>

</div>

<footer>
    © 2026 - Todos os direitos reservados.
</footer>

</body>
</html>
