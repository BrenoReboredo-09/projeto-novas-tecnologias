{% extends 'camara_app/base.html' %}
{% block titulo %}Login – Sistema de Projetos de Lei{% endblock %}

{% block extra_css %}
<style>
    .container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px;
    }
    .card-login {
        width: 100%;
        max-width: 500px;
        background: white;
        border: 2px solid #3ca34a;
        border-radius: 15px;
        padding: 40px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }
    .card-login h2 {
        text-align: center;
        color: #19692c;
        margin-bottom: 30px;
        font-size: 2rem;
    }
    .campo { margin-bottom: 20px; }
    .campo input {
        width: 100%;
        padding: 15px;
        border: 2px solid #3ca34a;
        border-radius: 8px;
        font-size: 16px;
    }
    .campo input:focus { outline: none; border-color: #19692c; }
    .btn-login {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 8px;
        background: #3ca34a;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }
    .btn-login:hover { background: #2f853b; }
    .cadastro-link { text-align: center; margin-top: 20px; }
    .cadastro-link a { color: #19692c; font-weight: bold; text-decoration: none; }
    .cadastro-link a:hover { text-decoration: underline; }
</style>
{% endblock %}

{% block conteudo %}
<div class="container">
    <div class="card-login">
        <h2>Entrar</h2>
        <form method="post">
            {% csrf_token %}
            <div class="campo">
                <input type="text" name="username" placeholder="Usuário" required>
            </div>
            <div class="campo">
                <input type="password" name="password" placeholder="Senha" required>
            </div>
            <button type="submit" class="btn-login">Entrar</button>
        </form>
        <div class="cadastro-link">
            Não possui conta? <a href="{% url 'cadastro' %}">Cadastre-se</a>
        </div>
    </div>
</div>
{% endblock %}
